<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <title>CEO/$ — The marketplace for emerging clothing brands</title>
    <meta name="description" content="CEO/$ hosts your storefront, puts your brand in front of shoppers, and handles checkout and payouts. Apply to sell — every brand is reviewed before it goes live." />
    <script>
      // Apply the saved colour scheme before first paint, so there is no light flash.
      (function () {
        try {
          var saved = localStorage.getItem('ceo-theme');
          var dark = saved
            ? saved === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
